name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: a dependency can gain a security advisory without any commit here.
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The Ubuntu releases differ in the Wireshark they ship (3.6, 4.2 and
        # 4.6 at the time of writing), which is what this is here to cover.
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Wireshark tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Install Wireshark tools (macOS)
        if: runner.os == 'macOS'
        run: brew install wireshark
      - name: Check that sharkd is available
        run: sharkd -v
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  debian:
    # Debian 12 ships Wireshark 4.0, which no Ubuntu runner has.
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install Wireshark tools and a C toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y tshark curl ca-certificates build-essential git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that sharkd is available
        run: sharkd -v
      - run: cargo test

  audit:
    # Fails if a dependency has a known security advisory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-targets

  format:
    # Formatting for everything that is not Rust: Markdown, YAML and TOML.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@3 --check "**/*.{md,yml,yaml}"
      - run: npx --yes @taplo/cli@0.7 fmt --check
