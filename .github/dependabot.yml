version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The msrv job pins this action's tag to the oldest Rust supported;
      # it moves when the minimum version does, by hand.
      - dependency-name: dtolnay/rust-toolchain
