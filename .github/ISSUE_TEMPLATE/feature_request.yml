name: Feature request
description: Something packetshark should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the solution. What are you looking for in a capture when you miss this?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. If Wireshark or tshark already does it, say where.
