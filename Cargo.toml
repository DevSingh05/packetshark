[package]
name = "packetshark"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A fast terminal UI for Wireshark: packet list, dissection tree and hex view, powered by sharkd"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DevSingh05/packetshark"
homepage = "https://github.com/DevSingh05/packetshark"
keywords = ["wireshark", "pcap", "tui", "network", "sharkd"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/", ".editorconfig", ".prettierignore", ".prettierrc.toml", ".taplo.toml"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
dirs = "7.0.0"
libc = "0.2.191"
ratatui = "0.30.2"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3.27.0"
toml = "1.2.1"
unicode-width = "0.2.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unreachable_pub = "allow"

[lints.clippy]
# Leftovers that must never ship.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# A curated slice of clippy::pedantic. CI runs clippy with -D warnings.
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
format_push_string = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
wildcard_imports = "warn"
